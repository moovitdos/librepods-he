name: Hebrew Debug Build

# Builds the Hebrew translation branch as a RELEASE-signed APK plus the
# flashable root-module ZIP, using our own release keystore provided via
# repo secrets. No Discord, no GitHub release — artifacts only.

on:
  push:
    branches:
      - hebrew-translation
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Licenses
        run: yes | sdkmanager --licenses
      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 --decode > android/release.keystore
      - name: Create local.properties
        run: |
          cat <<EOF > android/local.properties
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
      - name: Build FOSS release APK + root-module ZIP
        run: ./gradlew assembleFossRelease zipReleaseModule --stacktrace
        working-directory: android
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-foss-release
          path: android/app/build/outputs/apk/foss/release/app-foss-release.apk
          if-no-files-found: error
      - name: Upload root-module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: root-module-release
          path: android/app/build/outputs/rootModuleZips/*.zip
          if-no-files-found: error
